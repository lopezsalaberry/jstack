name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest shellcheck-py
      - run: make test
      - name: bash 3.2 syntax (macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash --version | head -1 && /bin/bash -n install.sh
